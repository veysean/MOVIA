/* ===== 1. DESIGN TOKENS (Steel Azure / Deep Saffron, constitution V) ===== */
:root{
  /* colour */
  --azure:#004E9F; --azure-soft:#E8F0F9; --saffron:#F98F11; --saffron-soft:#FFEBD1; --saffron-text:#A85A00;
  --pearl:#F8FAFC; --white:#FFFFFF; --navy:#0B1F3A; --muted:rgba(11,31,58,.68); --line:rgba(11,31,58,.10);
  --ok:#2F9E68; --ok-soft:#DDF0E5; --ok-text:#1E7A4C;
  --warn:#B9860F; --warn-soft:#F6EACB; --warn-text:#8A6100;
  --danger:#B3261E;
  /* type scale */
  --fs-xs:13px; --fs-sm:14px; --fs-md:16px; --fs-lg:20px; --fs-xl:28px;
  /* spacing (4 / 8 grid) */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --gutter:20px; --tap:44px;
  /* shape */
  --r-sm:10px; --r-md:14px; --r-lg:18px; --r-pill:999px;
  /* elevation: hairlines for structure, one soft lift for floating things */
  --lift:0 6px 20px rgba(11,31,58,.12);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Kantumruy Pro","Noto Sans Khmer","Khmer OS Battambang","Leelawadee UI",sans-serif;
}

/* ===== 2. BASE ===== */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--font);font-size:var(--fs-md);font-weight:400;color:var(--navy);background:#E9EEF5;line-height:1.45}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
button:disabled{cursor:not-allowed}
.btn:not(:disabled):active,.list-row:not(:disabled):active,.chip:active{transform:scale(.985)}
:focus-visible{outline:3px solid var(--azure);outline-offset:2px;border-radius:8px}
h1{font-size:24px;font-weight:600;line-height:1.3}
h2{font-size:17px;font-weight:600;line-height:1.35}
.cap{font-size:var(--fs-xs);color:var(--muted)}
.eyebrow{font-size:var(--fs-xs);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--azure)}
.center{text-align:center}
.stack>*+*{margin-top:var(--sp-3)}
.row{display:flex;align-items:center;gap:var(--sp-3)}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.ic{flex:none}
.lang-km *{line-height:1.7}

/* ===== 3. DEVICE FRAME (iPhone, 390x844 canvas) ===== */
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;padding:16px}
.iphone{--home:22px;position:relative;flex:none;padding:13px;border-radius:64px;background:#0d0e12;zoom:var(--fit,1);
  box-shadow:0 0 0 2px #7d828c,0 0 0 4px #2a2c33,inset 0 0 0 2px #23252b,0 40px 90px rgba(11,31,58,.35)}
.iphone .side{position:absolute;width:4px;background:#5d6169;border-radius:2px}
.iphone .s-action{left:-6px;top:118px;height:30px}
.iphone .s-volup{left:-6px;top:176px;height:58px}
.iphone .s-voldn{left:-6px;top:246px;height:58px}
.iphone .s-power{right:-6px;top:206px;height:92px}
.phone{position:relative;width:390px;height:844px;background:var(--pearl);border-radius:51px;overflow:hidden;display:flex;flex-direction:column;isolation:isolate}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;border-radius:20px;background:#000;z-index:40;pointer-events:none}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:138px;height:5px;border-radius:3px;background:var(--navy);z-index:40;pointer-events:none}
@media (max-width:430px){.stage{padding:0}.iphone{--home:0px;padding:0;border-radius:0;box-shadow:none;background:none;zoom:1;width:100vw}.iphone .side,.island,.homebar{display:none}.phone{width:100vw;height:100dvh;border-radius:0}}

/* ===== 4. APP SHELL: status row, screen, tab bar ===== */
.status{height:54px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:10px 22px 0 26px;background:var(--pearl)}
.clock{font-weight:600;font-size:15px}
.lang{display:flex}
.lang button{position:relative;isolation:isolate;min-width:var(--tap);height:var(--tap);padding:0 6px;font-size:var(--fs-xs);font-weight:600;color:var(--muted);text-align:center}
.lang button::before{content:"";position:absolute;inset:8px 1px;border-radius:var(--r-pill);background:transparent;z-index:-1;transition:background .15s}
.lang button[aria-pressed="true"]{color:#fff}
.lang button[aria-pressed="true"]::before{background:var(--azure)}
.screen{flex:1;overflow-y:auto;padding:0 var(--gutter) var(--sp-4);outline:none}
.screen{display:flex;flex-direction:column}
.screen>*{flex:none}
.foot{margin-top:auto}
.tabbar{flex:none;display:flex;background:var(--white);border-top:1px solid var(--line);padding:var(--sp-1) var(--sp-1) calc(var(--sp-1) + var(--home) + env(safe-area-inset-bottom))}
.tabbar[hidden]{display:none}
.tab{flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--muted);border-radius:var(--r-md);text-align:center}
.tab[aria-current="page"]{color:var(--azure);font-weight:600}
.tab.tab-charge{color:var(--saffron-text);font-weight:600}
.tab .tab-bolt{background:var(--saffron);color:var(--navy);width:40px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center}
.hdr{display:flex;align-items:center;gap:var(--sp-1);padding:var(--sp-1) 0 var(--sp-3);margin-left:-10px;position:sticky;top:0;background:var(--pearl);z-index:2}
.hdr.noback{margin-left:0}
.hdr h1{font-size:22px}
.iconbtn{width:var(--tap);height:var(--tap);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--navy);flex:none}
.iconbtn:not(:disabled):active{background:var(--azure-soft)}
.iconbtn.solid{background:var(--white);box-shadow:var(--lift)}
.phone.notabs .foot{padding-bottom:var(--home)}
.foot{position:sticky;bottom:0;padding-top:var(--sp-3);background:linear-gradient(to top,var(--pearl) 78%,rgba(248,250,252,0))}
.foot .btn+.btn{margin-top:var(--sp-2)}

/* ===== 5. COMPONENTS ===== */
/* buttons */
.btn{width:100%;min-height:52px;padding:12px var(--sp-4);border-radius:var(--r-md);font-weight:600;text-align:center;display:flex;align-items:center;justify-content:center;gap:var(--sp-2)}
.btn-primary{background:var(--azure);color:#fff}
.btn-primary:disabled{background:#8FB0D6}
.btn-secondary{background:var(--azure-soft);color:var(--azure)}
.btn-secondary:disabled{opacity:.55}
.btn-energy{background:var(--saffron);color:var(--navy)}
.btn-quiet{color:var(--muted)}
/* surfaces */
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--sp-4)}
.group{background:var(--white);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.group>*+*{border-top:1px solid var(--line)}
.group>.list-row{border:0;border-radius:0;background:transparent}
.group>.list-row+.list-row{border-top:1px solid var(--line)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.tile{background:var(--white);padding:14px var(--sp-4)}
.tile.wide{grid-column:1/-1}
.tile b{display:block;font-size:var(--fs-lg);font-weight:600;margin-top:2px;overflow-wrap:anywhere}
.stats{display:flex}
.stat{flex:1;padding:2px 0}
.stat+.stat{border-left:1px solid var(--line);padding-left:var(--sp-4)}
.stat b{display:block;font-size:var(--fs-xl);font-weight:600;line-height:1.2}
.note{background:var(--azure-soft);border-radius:var(--r-md);padding:var(--sp-3) 14px;font-size:var(--fs-sm)}
.money{font-size:var(--fs-xl);font-weight:600;overflow-wrap:anywhere}
.kv{display:flex;gap:var(--sp-3);padding:var(--sp-2) 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
.kv .k{width:84px;flex:none;color:var(--muted);font-size:var(--fs-sm)}
/* rows */
.list-row{width:100%;min-height:60px;display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-2) var(--sp-4);background:var(--white);border:1px solid var(--line);border-radius:var(--r-md);text-align:left}
.list-row .t{display:block;font-weight:600}
.list-row .cap{display:block}
.list-row[aria-pressed="true"],.list-row[aria-checked="true"]{background:var(--azure-soft);box-shadow:inset 0 0 0 2px var(--azure)}
.list-row:disabled{opacity:.55}
.list-row.opt{padding:14px var(--sp-4)}
.list-row.opt.best{border-color:var(--saffron);box-shadow:inset 0 0 0 1px var(--saffron)}
.lead{width:40px;height:40px;border-radius:var(--r-sm);background:var(--azure-soft);color:var(--azure);display:flex;align-items:center;justify-content:center;flex:none}
.trail{color:var(--muted);display:flex;align-items:center;gap:var(--sp-2);flex:none}
.hrow{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3) var(--sp-4)}
.hrow .end{text-align:right}
.hrow .amt{font-weight:600;font-size:var(--fs-sm);margin-top:var(--sp-1)}
/* labels and status */
.pill{display:inline-flex;align-items:center;gap:var(--sp-1);padding:2px 10px;border-radius:var(--r-pill);font-size:var(--fs-xs);font-weight:600}
.pill-fast{background:var(--saffron-soft);color:var(--saffron-text)}
.pill-normal{background:var(--azure-soft);color:var(--azure)}
.pill-ok{background:var(--ok-soft);color:var(--ok-text)}
.pill-busy{background:#ECEFF3;color:var(--muted)}
.st-ok{--st-fill:var(--ok);--st-soft:var(--ok-soft);--st-text:var(--ok-text)}
.st-warn{--st-fill:var(--warn);--st-soft:var(--warn-soft);--st-text:var(--warn-text)}
.st-now{--st-fill:var(--saffron);--st-soft:var(--saffron-soft);--st-text:var(--saffron-text)}
.bigcircle{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:var(--sp-2) auto;background:var(--st-soft);color:var(--st-text)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 16px;border-radius:var(--r-pill);background:var(--st-soft);color:var(--st-text);font-weight:600;font-size:var(--fs-sm);letter-spacing:.03em}
.state-head{padding:var(--sp-5) 0 var(--sp-2)}
.bar{height:10px;border-radius:var(--r-pill);background:rgba(11,31,58,.08);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:var(--r-pill);background:var(--st-fill,var(--azure))}
.steps{display:flex;gap:6px;margin:0 0 var(--sp-4)}
.steps i{flex:1;height:5px;border-radius:3px;background:rgba(11,31,58,.10)}
.steps i.on{background:var(--azure)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;box-shadow:inset 0 0 0 1px rgba(11,31,58,.3)}
.badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.badges span{padding:3px 10px;border-radius:var(--r-sm);background:var(--azure-soft);color:var(--azure);font-size:var(--fs-xs);font-weight:600}
/* inputs */
.search{width:100%;min-height:52px;display:flex;align-items:center;gap:var(--sp-3);padding:0 var(--sp-4);background:var(--white);border:1px solid var(--line);border-radius:var(--r-md);color:var(--muted)}
.search input{flex:1;border:0;outline:none;font:inherit;color:var(--navy);background:transparent;min-height:var(--tap)}
.field{width:100%;min-height:52px;border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--white);padding:0 14px;font:inherit;color:var(--navy)}
.field:focus-visible{outline:none;border-color:var(--azure);box-shadow:0 0 0 3px var(--azure-soft)}
textarea.field{padding:var(--sp-3) 14px;resize:none;min-height:96px;line-height:1.5}
select.field{appearance:auto}
.err{color:var(--danger);font-size:var(--fs-xs);margin-top:var(--sp-1)}
.range{width:100%;height:var(--tap);accent-color:var(--azure)}
.chips{display:flex;gap:var(--sp-2);flex-wrap:wrap}
.chips-scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 calc(-1 * var(--gutter));padding:2px var(--gutter);scrollbar-width:none}
.chips-scroll::-webkit-scrollbar{display:none}
.chips-scroll .chip{flex:none}
.link{min-height:var(--tap);padding:0 var(--sp-1);color:var(--azure);font-weight:600;font-size:var(--fs-sm)}
.sec-head{margin-bottom:var(--sp-2)}
.sheet-title{margin-bottom:var(--sp-3)}
.chip{min-height:var(--tap);padding:0 var(--sp-4);border-radius:var(--r-pill);background:var(--white);border:1px solid var(--line);font-weight:600;font-size:var(--fs-sm);display:inline-flex;align-items:center}
.chip[aria-pressed="true"],.chip[aria-checked="true"]{background:var(--azure);color:#fff;border-color:var(--azure)}
.seg{display:flex;background:#E6ECF4;border-radius:var(--r-md);padding:var(--sp-1)}
.seg button{flex:1;min-height:var(--tap);border-radius:var(--r-sm);font-weight:600;text-align:center;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--muted)}
.seg button[aria-pressed="true"],.seg button[aria-checked="true"]{background:var(--white);color:var(--azure);box-shadow:0 1px 3px rgba(11,31,58,.12)}
.swatches{display:flex;gap:14px;padding:var(--sp-1)}
.swatch{width:var(--tap);height:var(--tap);border-radius:50%;box-shadow:inset 0 0 0 1px rgba(11,31,58,.3)}
.swatch[aria-checked="true"]{outline:3px solid var(--azure);outline-offset:3px}
.stars{display:flex;gap:var(--sp-1)}
.star{width:var(--tap);height:var(--tap);display:flex;align-items:center;justify-content:center;border-radius:var(--r-sm);color:var(--muted)}
.star.on{color:var(--saffron-text)}
/* vehicle data source line + trust banner + switch (Slice 3a) */
.st-neutral{--st-fill:var(--muted);--st-soft:#ECEFF3;--st-text:var(--muted)}
.src{display:flex;align-items:center;gap:var(--sp-2);width:100%;min-height:var(--tap);padding:0 var(--sp-3);border-radius:var(--r-md);background:var(--st-soft);color:var(--st-text);font-size:var(--fs-sm);font-weight:600;text-align:left}
.src .ic{flex:none}
.trust{display:flex;gap:var(--sp-3);align-items:flex-start;background:var(--warn-soft);color:var(--navy);border-radius:var(--r-md);padding:var(--sp-3) 14px;font-size:var(--fs-sm);text-align:left}
.trust>.ic{color:var(--warn-text);margin-top:2px}
.trust .chip{margin-top:var(--sp-2);background:var(--white)}
.switch{position:relative;width:52px;height:var(--tap);flex:none;display:flex;align-items:center;justify-content:center}
.switch::before{content:"";width:44px;height:26px;border-radius:13px;background:rgba(11,31,58,.18);transition:background .15s}
.switch::after{content:"";position:absolute;left:7px;top:11px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(11,31,58,.3);transition:transform .15s}
.switch[aria-checked="true"]::before{background:var(--azure)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}
.switch:disabled{opacity:.6}
.perm{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3) var(--sp-4)}
.checks{list-style:none}
.checks li{display:flex;gap:var(--sp-2);align-items:center;padding:6px 0}
.checks .ic{color:var(--ok-text)}
/* charger discovery (Slice 3b) */
.pill-warn{background:var(--warn-soft);color:var(--warn-text)}
.pill-unknown{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--muted)}
.why{display:block;margin-top:var(--sp-3);padding-top:var(--sp-3);border-top:1px solid var(--line)}
.why-r{display:flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-sm);margin-top:6px}
.why-r .ic{color:var(--ok-text)}
.legend{display:flex;gap:var(--sp-4);flex-wrap:wrap}.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:50%}.lg-best{background:var(--saffron-text)}.lg-free{background:var(--azure)}.lg-muted{background:#7C8796}
/* real map (Slice 4) */
.map{isolation:isolate}
.lmap{position:absolute;inset:0;z-index:0;background:#E9EEF3}
.map .leaflet-container{font:inherit;background:#E9EEF3;outline:none}
.map .leaflet-control-attribution{font-size:10px;background:rgba(255,255,255,.85);border-radius:8px 0 0 0}
.map .leaflet-bar{border:0;box-shadow:var(--lift);border-radius:var(--r-md);overflow:hidden}
.map .leaflet-bar a{width:36px;height:36px;line-height:36px;color:var(--navy)}
.map-loc{position:absolute;left:10px;top:10px;z-index:2;display:inline-flex;align-items:center;gap:4px;max-width:calc(100% - 70px);background:rgba(255,255,255,.94);color:var(--navy);padding:4px 10px;border-radius:var(--r-pill);font-size:12px;font-weight:600;box-shadow:var(--lift);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.map-loc .ic{color:var(--azure)}
.map-locate{position:absolute;right:10px;bottom:30px;z-index:2}
.map .map-chip{z-index:2;bottom:24px}
.map-off{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;background:var(--white);color:var(--navy);border-radius:var(--r-pill);padding:6px 12px;font-size:var(--fs-xs);font-weight:600;box-shadow:var(--lift);white-space:nowrap;align-items:center;gap:6px}
.map.offline .map-off{display:inline-flex}
.lpin{display:flex!important;align-items:flex-end;justify-content:center;filter:drop-shadow(0 2px 2px rgba(11,31,58,.3));cursor:pointer}
.lpin svg{transition:transform .15s;transform-origin:50% 100%}
.lpin.sel svg{transform:scale(1.3)}
.lpin-best,.lpin-dest,.lpin-shop{color:var(--saffron-text)} .lpin-free{color:var(--azure)} .lpin-muted{color:#7C8796} .lpin-place{color:#4B6A8F}
.lpin:focus-visible{outline:3px solid var(--azure);outline-offset:2px;border-radius:50%}
.lyou i{display:block;width:18px;height:18px;margin:2px;border-radius:50%;background:var(--azure);border:3px solid #fff;box-shadow:0 0 0 6px rgba(0,78,159,.2),0 1px 3px rgba(11,31,58,.4)}
.avatar{width:var(--tap);height:var(--tap);border-radius:50%;background:var(--azure);color:#fff;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none}

/* ===== 6. SCREEN-SPECIFIC ===== */
.home-hdr{display:flex;align-items:center;justify-content:space-between;padding:var(--sp-2) 0 var(--sp-4)}
.home-hdr h1{font-size:26px}
.hero .num{font-size:32px;font-weight:600;line-height:1.15}
.ringwrap{position:relative;width:200px;height:200px;margin:var(--sp-2) auto}
.ringwrap .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringwrap .mid b{font-size:44px;font-weight:600;line-height:1.1}
.map{position:relative;border-radius:var(--r-lg);overflow:hidden;background:#F3F0E8;height:190px;border:1px solid var(--line)}
.map.tall{height:230px}
.map-chip{position:absolute;left:var(--sp-3);bottom:var(--sp-3);background:var(--white);border-radius:var(--r-pill);padding:6px var(--sp-3);font-size:var(--fs-sm);font-weight:600;box-shadow:var(--lift)}
.banner{display:flex;align-items:center;gap:14px;background:var(--azure);color:#fff;border-radius:var(--r-lg);padding:14px var(--sp-4)}
.banner .turn{width:52px;height:52px;border-radius:var(--r-md);background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;flex:none}
.scanbox{position:relative;height:300px;border-radius:var(--r-lg);background:#0B1F3A;overflow:hidden}
.scanbox.torch{background:#26456F}
.scanbox .frame{position:absolute;inset:50px;border:3px solid #fff;border-radius:var(--r-lg);opacity:.9}
.scanbox .line{position:absolute;left:56px;right:56px;height:3px;background:var(--saffron);top:60px;animation:scan 1.8s ease-in-out infinite alternate}
@keyframes scan{to{top:230px}}
.qr{display:block;margin:0 auto;background:#fff;border-radius:var(--r-sm);padding:10px}
.rev p+p{margin-top:var(--sp-1)}

/* ===== 7. OVERLAYS: loading, hand-off, toast, sheet ===== */
.loading{position:absolute;inset:0;background:rgba(248,250,252,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:20}
.loading[hidden]{display:none}
#handoff{background:var(--pearl)}
.handoff{display:flex;flex-direction:column;align-items:center;gap:var(--sp-3);text-align:center;padding:0 32px}
.handoff .mark.ok{background:var(--ok-soft);color:var(--ok-text);animation:none}
.handoff b{font-size:18px}
.mark{width:64px;height:64px;border-radius:var(--r-lg);background:var(--azure);color:var(--saffron);display:flex;align-items:center;justify-content:center;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.92);opacity:.85}}
.toast{position:absolute;left:50%;top:58px;max-width:calc(100% - 2 * var(--gutter));width:max-content;background:var(--navy);color:#fff;border-radius:var(--r-pill);padding:10px 18px;font-size:var(--fs-sm);font-weight:600;text-align:center;opacity:0;pointer-events:none;transform:translate(-50%,-8px);transition:opacity .2s,transform .2s;z-index:30;box-shadow:var(--lift)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;padding:40px var(--sp-4);color:var(--muted)}
.empty .ic{color:var(--azure);margin-bottom:var(--sp-2)}
.sheet-back{position:absolute;inset:0;background:rgba(11,31,58,.45);z-index:25;display:flex;align-items:flex-end}
.sheet{background:#fff;border-radius:24px 24px 0 0;padding:var(--sp-3) var(--sp-4) 24px;width:100%}
.sheet::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto var(--sp-4)}
.sheet .btn+.btn{margin-top:var(--sp-2)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  </div>

<script>

  payTab: "qr", payFrom: null,
  vehicle: { ...MOCK_DATA.vehicle },
  profile: { name: "", username: "@sokha.chan", age: 27, gender: null, custom: false },
  form: seedForm(),
  location: null,
  onb2Mode: "choice", cv: seedCv(), prefs: { ...MOCK_DATA.config.prefDefaults }, batterySheet: null,

};
const timers = { nav: null, charge: null };
const $ = (s) => document.querySelector(s);
const cfg = MOCK_DATA.config, veh = state.vehicle;

function t(key, vars) {
  let s = I18N[state.lang][key];
  if (s === undefined) s = I18N.en[key] !== undefined ? I18N.en[key] : key;
  if (vars) for (const k in vars) s = s.split("{" + k + "}").join(vars[k]);
  return s;
}
const loc = (o) => o[state.lang] || o.en;
const round1 = (n) => Math.round(n * 10) / 10;
const fmtKm = (n) => { const r = round1(n); return (Number.isInteger(r) ? String(r) : r.toFixed(1)) + " " + t("unit.km"); };
const fmtKmWhole = (n) => Math.round(n) + " " + t("unit.km");
const fmtDur = (min) => {
  const m = Math.max(1, Math.round(min)), h = Math.floor(m / 60), r = m % 60;
  return h ? h + " " + t("unit.h") + " " + r + " " + t("unit.min") : m + " " + t("unit.min");
};
const fmtClock = (addMin) => {
  const [h, m] = cfg.clockStart.split(":").map(Number);
  const tot = h * 60 + m + Math.round(addMin);
  return String(Math.floor(tot / 60) % 24).padStart(2, "0") + ":" + String(tot % 60).padStart(2, "0");
};
const roundKhr = (khr) => Math.round(khr / 100) * 100;
const fmtMoney = (khr) => { const r = roundKhr(khr); return "$" + (r / cfg.usdToKhr).toFixed(2) + " / ៛" + r.toLocaleString("en-US"); };
const fmtTariff = (khr) => khr.toLocaleString("en-US") + " ៛/kWh";
const simulateLatency = () => new Promise((res) => setTimeout(res, cfg.latencyMs));
const kwhPerKm = () => veh.capacityKwh / veh.estimatedRangeKm;
const currentRangeKm = () => state.batteryPct / 100 * veh.estimatedRangeKm;
const esc = (v) => String(v).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const userName = () => state.profile.custom ? state.profile.name : loc(MOCK_DATA.user.name);

const initials = () => userName().trim().split(/\s+/).slice(0, 2).map((w) => Array.from(w)[0]).join("").toUpperCase();
const colorHex = () => (veh.colors.find((c) => c.key === veh.colorKey) || veh.colors[0]).hex;

const heldIds = () => new Set(state.reports.map((r) => r.reviewId));
const shopReviewsAll = (id) => [...state.postedReviews.filter((r) => r.shopId === id), ...MOCK_DATA.reviews.filter((r) => r.shopId === id)];
const shopReviews = (id) => shopReviewsAll(id).filter((r) => !heldIds().has(r.id));
function shopStats(shop) {
  let sum = shop.ratingAvg * shop.ratingCount, n = shop.ratingCount;
  state.postedReviews.filter((r) => r.shopId === shop.id).forEach((r) => { sum += r.stars; n++; });
  shopReviewsAll(shop.id).filter((r) => heldIds().has(r.id)).forEach((r) => { sum -= r.stars; n--; });
  return { avg: n ? sum / n : 0, count: n };
}
const allHistory = () => [...state.historyAdded, ...MOCK_DATA.chargeHistory].sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
const historyKind = (h) => findStation(h.stationId).kind;

/* Pure reachability function (Constitution II.4) */
function computeReachability(batteryPct, capacityKwh, estimatedRangeKm, distanceKm, thresholds = MOCK_DATA.config.thresholds) {
  const rangeKm = batteryPct / 100 * estimatedRangeKm;
  const arrivalPct = (rangeKm - distanceKm) / estimatedRangeKm * 100;
  const arrivalKwh = arrivalPct / 100 * capacityKwh;
  const status = arrivalPct >= thresholds.continueMinPct ? "continue"
    : arrivalPct >= thresholds.chargeLaterMinPct ? "chargeLater" : "chargeNow";
  return { status, rangeKm, arrivalPct, arrivalKwh, shortfallKm: Math.max(0, distanceKm - rangeKm) };
}
/* The driver's arrival warning replaces the Continue threshold; the Charge Now floor stays fixed (constitution II.4). */
const driverThresholds = () => ({ continueMinPct: state.prefs.warnPct, chargeLaterMinPct: cfg.thresholds.chargeLaterMinPct });
const reachFor = (dest) => computeReachability(state.batteryPct, veh.capacityKwh, veh.estimatedRangeKm, dest.distanceKm, driverThresholds());

/* ---- location & distance (Slice 4, constitution II.3) ---- */
/* Pure: great-circle distance in km between two [lat, lng] points. */
function haversineKm(a, b) {
  const R = 6371, r = Math.PI / 180, dLat = (b[0] - a[0]) * r, dLng = (b[1] - a[1]) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const routeCache = new Map();

    if (!inF && rnd() > 0.52) cells += '<rect x="' + x * u + '" y="' + y * u + '" width="' + u + '" height="' + u + '" fill="#0B1F3A"/>';
  }
  return '<svg class="qr" width="170" height="170" viewBox="0 0 ' + N * u + " " + N * u + '" role="img" aria-label="' + t("pay.demo") + '">' + cells + finder(0, 0) + finder(N - 7, 0) + finder(0, N - 7) + "</svg>";
}

/* ==================== FORMS (validation, live updates) ==================== */
function validateOnb1() {
  const f = state.form, e = {};
  const name = (f.name === null ? loc(MOCK_DATA.user.name) : f.name).trim();
  if (!name) e.name = 1;
  if (!/^@?[a-z0-9._]{3,20}$/i.test(f.username.trim())) e.username = 1;
  const a = Number(f.age);
  if (!(f.age !== "" && Number.isInteger(a) && a >= 18 && a <= 99)) e.age = 1;
  return e;
}
function validateOnb2() {
  const f = state.form, e = {}, c = Number(f.capacity), r = Number(f.range);
  if (!(f.capacity !== "" && c >= 10 && c <= 120)) e.capacity = 1;
  if (!(f.range !== "" && r >= 50 && r <= 700)) e.range = 1;
  return e;
}
function refreshForm() {
  const e = state.screen === "onb1" ? validateOnb1() : state.screen === "onb2" ? validateOnb2() : null;

      '<section class="card"><div class="row"><span class="lead">' + ic("pin", 22) + '</span><div class="grow"><b>' + t("loc.title") + '</b><p class="cap">' + t("loc.body") + '</p></div></div><div class="row" style="margin-top:12px">' + btn("loc", t("loc.allow"), { kind: "secondary", attrs: ' data-v="on"' }) + btn("loc", t("loc.deny"), { kind: "secondary", attrs: ' data-v="off"' }) + '</div><p class="cap" role="status" style="margin-top:8px">' + locMsg + "</p></section></div>" +

  /* ---- B. Plan ---- */
  home() {
    const range = currentRangeKm(), pct = state.batteryPct;
    const hist = allHistory(), fast = hist.filter((h) => historyKind(h) === "fast").length, normal = hist.length - fast;
    const hubs = [...MOCK_DATA.stations].sort((a, b) => a.distanceKm - b.distanceKm).slice(0, 3);
    return '<div class="home-hdr"><div><p class="eyebrow">MOVIA</p><h1>' + t("home.hello", { name: userFirst() }) + '</h1></div><div class="avatar" aria-hidden="true">' + initials() + "</div></div>" +
      '<div class="stack">' +
      '<section class="card"><div class="hero row"><div class="ringwrap" style="width:112px;height:112px;margin:0">' + ringSvg(pct, 112, 10, "var(--azure)", "homeRing") + '<div class="mid"><b style="font-size:28px">' + Math.round(pct) + '%</b><span class="cap">' + t("home.battery") + "</span></div></div>" +
      '<div class="grow"><p class="cap"><span class="dot" style="background:' + colorHex() + '"></span> ' + veh.model + '</p><p class="cap" style="margin-top:8px">' + t("home.range") + '</p><p class="num">' + fmtKmWhole(range) + '</p></div></div><div style="margin-top:12px">' + sourceLine({ tap: true }) + "</div></section>" +
      '<button type="button" class="search" data-act="openDest">' + ic("search") + "<span>" + t("home.where") + "</span></button>" +
      '<section><div class="row between sec-head"><h2>' + t("home.hubs") + '</h2><button type="button" class="link" data-act="tab" data-v="charge">' + t("home.seemap") + "</button></div>" + group(hubs.map((s) => listRow({ act: "pickStation", id: s.id, icon: "plug", title: loc(s.name), sub: t("opt.away", { km: round1(s.distanceKm) }) + " · " + availText(stationAvailability(s, veh.connector)), end: kindPill(s.kind) }))) + "</section>" +
      '<section class="card"><div class="row between" style="margin-bottom:10px"><h2>' + t("home.history") + '</h2><button type="button" class="link" data-act="openHistory">' + t("hi.viewall") + '</button></div><div class="stats"><div class="stat"><b>' + fast + '</b><span class="cap">' + t("home.fast") + '</span></div><div class="stat"><b>' + normal + '</b><span class="cap">' + t("home.normal") + "</span></div></div></section>" +
      listRow({ act: "openMaintenance", icon: "wrench", title: t("home.maint"), sub: t("home.maint.sub"), end: chev() }) + "</div>";
  },
  destination() {
    return hdr("dest.title") + '<div class="stack"><label class="search">' + ic("search") + '<input id="destInput" type="search" value="' + esc(state.destQuery) + '" placeholder="' + t("dest.search") + '" aria-label="' + t("dest.search") + '"><button type="button" class="iconbtn" data-act="voice" aria-label="' + t("voice") + '">' + ic("mic") + "</button></label>" +
      '<div class="chips" role="group">' + ["all", "campus", "town"].map((f) => '<button type="button" class="chip" data-act="filter" data-v="' + f + '" aria-pressed="' + (state.destFilter === f) + '">' + t("filter." + f) + "</button>").join("") + "</div>" +
      mapBox("destMap", { tall: true, chip: destChip() }) +
      "<h2>" + t("dest.recent") + '</h2><div id="destList">' + destListInner() + "</div></div>" +
      foot(btn("confirmDest", state.destPick ? t("dest.confirm") : t("dest.choose"), { id: "destConfirm", disabled: !state.destPick }));
  },
  reach() {
    const d = state.destination, r = state.reach = reachFor(d); /* always from the current battery and the driver's warning level */
    const M = { continue: { cls: "st-ok", icon: "check", k: "continue" }, chargeLater: { cls: "st-warn", icon: "warn", k: "later" }, chargeNow: { cls: "st-now", icon: "battery", k: "now" } }[r.status];
    const fill = Math.min(100, r.rangeKm / d.distanceKm * 100);
    const detail = r.status === "chargeNow" ? (r.arrivalPct < 0 ? t("reach.short", { km: Math.round(r.shortfallKm) }) : t("reach.under5")) : t("reach.arrive", { pct: Math.round(r.arrivalPct) });
    const cta = r.status === "continue" ? btn("continueJourney", t("reach.cta.go"))
      : btn("viewOptions", t("reach.cta.options")) + (r.status === "chargeLater" ? btn("continueJourney", t("reach.cta.anyway"), { kind: "secondary" }) : "");
    return hdr("reach.eyebrow", { title: t("reach.eyebrow") }) + '<div class="' + M.cls + ' center state-head"><span class="badge">' + ic(M.icon, 16) + t("reach." + M.k + ".badge") + '</span><h1 style="margin-top:14px">' + t("reach." + M.k + ".head") + '</h1><p style="color:var(--muted);margin-top:4px">' + t("reach." + M.k + ".sub") + "</p>" +
      '<section class="card" style="margin-top:24px;text-align:left"><div class="row between"><span class="cap">' + t("reach.range") + "</span><b>" + fmtKmWhole(r.rangeKm) + '</b></div><div class="row between" style="margin-top:4px"><span class="cap">' + t("reach.distance", { dest: loc(d.name) }) + "</span><b>" + fmtKm(d.distanceKm) + '</b></div><div class="bar" style="margin:14px 0 10px"><i style="width:' + fill + '%"></i></div><p style="font-size:14px">' + detail + "</p></section>" +
      '<div class="stack" style="margin-top:12px">' + trustBanner() + sourceLine({ tap: true }) + "</div></div>" +
      foot(cta);
  },
  options() {
    const dest = state.destination, hd = hdr("opt.title", { sub: dest ? t("opt.sub", { dest: loc(dest.name) }) : t("opt.sub.none") });
    if (state.optionsError) return hd + stateBlock("alert", t("opt.error"), "viewOptions");
    if (!state.options.length) return hd + stateBlock("plug", t("opt.empty"));
    const f = state.optFilters, list = visibleStations(), view = state.optView;
    const controls = '<div class="seg" role="radiogroup" aria-label="' + t("view.list") + " / " + t("view.map") + '">' + [["list", "route"], ["map", "pin"]].map(([v, i]) => '<button type="button" role="radio" data-act="optView" data-v="' + v + '" aria-checked="' + (view === v) + '">' + ic(i, 18) + t("view." + v) + "</button>").join("") + "</div>" +
      '<div class="chips chips-scroll" role="group" aria-label="' + t("flt.label") + '">' + ["fits", "free", "fast", "khqr"].map((k) => '<button type="button" class="chip" data-act="optFilter" data-v="' + k + '" aria-pressed="' + !!f[k] + '">' + (f[k] ? ic("check", 16) + "&nbsp;" : "") + t("flt." + k) + "</button>").join("") + "</div>" +

    if (!list.length) return hd + '<div class="stack">' + controls + '<div class="empty">' + ic("search", 40) + "<p>" + t("opt.nomatch") + "</p>" + btn("optClear", t("opt.clear"), { kind: "secondary", attrs: ' style="margin-top:16px"' }) + "</div></div>";
    const bestId = list[0].id;

    } else {
      body = list.map((s) => stationCard(s, s.id === bestId)).join("");
    }
    return hd + '<div class="stack">' + controls + body + "</div>";
  },
  detail() {
    const s = state.station, c = veh.connector, bays = stationBays(s.id), compat = stationCompat(s, c), av = stationAvailability(s, c);
    const pillCls = { available: "pill-ok", busy: "pill-busy", offline: "pill-warn", unknown: "pill-unknown" };
    const bayRows = bays.map((b) => {
      const st = bayStatus(b), fits = compat.includes(b), usable = fits && (st === "available" || st === "unknown");
      return listRow({ act: "pickBay", id: b.id, icon: "plug", title: t("detail.bay", { n: b.n }), sub: b.connector + " · " + b.powerKw + " kW" + (fits ? "" : " · " + t("sd2.nofit", { c })),
        end: '<span class="pill ' + pillCls[st] + '">' + t("st." + st) + "</span>", disabled: !usable, attrs: ' role="radio" data-status="' + st + '" aria-checked="' + (!!state.bay && state.bay.id === b.id) + '"' });
    });
    const availLine = !av.total ? '<p class="src st-warn">' + ic("alert", 16) + '<span class="grow">' + t("opt.nofit") + "</span></p>"
      : av.live ? '<p class="src ' + (av.free ? "st-ok" : "st-warn") + '">' + ic(av.free ? "check" : "clock", 16) + '<span class="grow">' + t("sd2.live", { a: av.free, n: av.total, ago: agoText(av.updatedMinAgo) }) + "</span></p>"
      : '<p class="src st-neutral">' + ic("alert", 16) + '<span class="grow">' + t("sd2.nolive") + "</span></p>";
    const unconfirmed = state.bay && bayStatus(state.bay) === "unknown" ? '<p class="note">' + t("sd2.unconfirmed") + "</p>" : "";
    return hdr("opt.title", { title: loc(s.name), sub: loc(s.address) }) + '<div class="stack"><section class="card"><div class="row between" style="align-items:flex-start"><div>' + kindPill(s.kind) + '<p class="cap" style="margin-top:6px">' + t("opt.away", { km: round1(s.distanceKm) }) + '</p><p class="cap">' + t("sd2.operator") + ": <b>" + esc(s.operator) + '</b></p></div><div style="text-align:right"><p class="cap">' + t("detail.tariff") + "</p><b>" + fmtTariff(s.tariffKhr) + '</b><p class="cap">≈ $' + (s.tariffKhr / cfg.usdToKhr).toFixed(2) + "/kWh</p></div></div>" +
      '<div style="margin-top:12px">' + availLine + '</div><div class="row" style="margin-top:12px;flex-wrap:wrap;gap:6px"><span class="cap">' + t("sd2.pay") + '</span><span class="badges" style="justify-content:flex-start">' + s.payments.map((m) => "<span>" + t("pm." + m) + "</span>").join("") + "</span></div></section>" +
      "<h2>" + t("detail.bays") + '</h2><div class="stack" role="radiogroup" aria-label="' + t("detail.bays") + '">' + bayRows.join("") + "</div>" + unconfirmed + '<p class="cap" id="infoOnly">' + t("sd2.infoOnly") + "</p></div>" +
      foot(btn("navigateStation", t("detail.navigate"), { disabled: !state.bay }));
  },

  /* ---- C. Drive ---- */
  routing() {
    const leg = state.leg, km = legKm(), min = legMin();
    const kwh = km * kwhPerKm(), arrPct = Math.max(0, state.batteryPct - km / veh.estimatedRangeKm * 100);
    return hdr("route.title", { sub: leg.resumed ? t("route.resume", { name: loc(leg.name) }) : t("route.to", { name: loc(leg.name) }) }) + '<div class="stack">' + mapBox("routeMap", { tall: true, locate: false, chip: (leg.estimated ? "≈ " : "") + fmtKm(km) + " · ≈ " + fmtDur(min) + (leg.estimated ? "" : " · " + t("map.road")) }) +

      foot(btn("startTrip", t("route.start")));
  },
  live() {
    const leg = state.leg;

      mapBox("liveMap", { tall: true, locate: false }) + '<section class="card stack"><div class="bar"><i id="navBar" style="width:0%"></i></div><div class="row between"><div><p class="cap">' + t("nav.remaining") + '</p><b id="navRemain"></b></div><span class="pill pill-ok">' + t("nav.gps") + '</span></div><div class="seg" role="group">' +
      ["A", "B"].map((v) => '<button type="button" data-act="routeVariant" data-v="' + v + '" aria-pressed="' + (state.routeVariant === v) + '">' + t("nav.route" + v) + "</button>").join("") + "</div></section></div>" +
      foot(btn("arrived", t("nav.arrived"), { kind: "secondary" }));

  arrive() {

  /* ---- H. Account ---- */

      '<section class="card row"><div class="avatar" style="width:56px;height:56px;font-size:18px" aria-hidden="true">' + initials() + '</div><div class="grow"><b style="font-size:18px">' + userName() + '</b><p class="cap">' + userHandle() + '</p></div></section>' +

/* ==================== RENDER & ROUTER ==================== */
const TAB_SCREENS = ["home", "options", "maintenance", "profile"];
function renderTabs() {
  const bar = $("#tabbar");
  bar.hidden = !TAB_SCREENS.includes(state.screen);
  $("#phone").classList.toggle("notabs", bar.hidden);
  const cur = state.screen === "options" ? "charge" : state.screen === "maintenance" ? "maintenance" : state.screen === "profile" ? "profile" : "home";
  const tabs = [["home", "home"], ["charge", "bolt"], ["maintenance", "wrench"], ["profile", "user"]];
  bar.innerHTML = tabs.map(([k, i]) => '<button type="button" class="tab' + (k === "charge" ? " tab-charge" : "") + '" data-act="tab" data-v="' + k + '"' + (k === cur ? ' aria-current="page"' : "") + ">" + (k === "charge" ? '<span class="tab-bolt">' + ic(i, 20) + "</span>" : ic(i, 24)) + "<span>" + t("tab." + k) + "</span></button>").join("");
}
function render() {
  $("#phone").classList.toggle("lang-km", state.lang === "km");
  document.documentElement.lang = state.lang === "km" ? "km" : "en";
  document.querySelectorAll(".lang button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === state.lang)));
  $("#loadingText").textContent = t("loading");
  $("#clock").textContent = fmtClock(state.clockMin);
  $("#screen").innerHTML = screens[state.screen]();
  renderTabs();
  $("#sheet").innerHTML = state.reportFor ? reportSheet() : state.batterySheet ? batterySheetHtml() : state.confirmSheet ? disconnectSheet() : "";
  if (state.reportFor || state.batterySheet || state.confirmSheet) { const b = $("#sheet button"); if (b) b.focus(); }
  refreshForm();
  mountMaps();
  if (state.screen === "live") { const t0 = state.navProgress; updateNavDom(t0); }
  if (state.screen === "charging") updateChargeDom();
}
function fitFrame() {
  const z = window.innerWidth <= 430 ? 1 : Math.min(1, (window.innerHeight - 24) / 872, (window.innerWidth - 24) / 424);
  document.documentElement.style.setProperty("--fit", String(Math.max(0.4, z)));
}
window.addEventListener("resize", fitFrame); fitFrame();
function clearTimers() { for (const k in timers) { clearInterval(timers[k]); timers[k] = null; } }
function go(id, o = {}) {
  clearTimers();
  if (o.reset) state.stack = [id];
  else if (o.replace) state.stack[state.stack.length - 1] = id;
  else if (state.stack[state.stack.length - 1] !== id) state.stack.push(id);
  state.screen = id;
  render();
  $("#screen").scrollTop = 0;
  if (id === "live") startNav();

}
function back() {
  /* Connect Vehicle steps back within the screen; the manual vehicle form steps back to the choice. */
  if (state.screen === "connect") {
    const prev = { perm: "brand", unsupported: "brand", error: "perm", empty: "perm", pick: "brand", confirm: null }[state.cv.step];
    if (state.cv.step === "confirm") { const acc = findCarAccount(state.cv.accountId); state.cv.step = acc.cars.length > 1 ? "pick" : "perm"; render(); return; }
    if (prev) { state.cv.step = prev; render(); return; }
  }
  if (state.screen === "onb2" && state.onb2Mode === "manual") { state.onb2Mode = "choice"; render(); return; }
  if (state.screen === "charging" && !state.session.stopped) { state.session = null; }
  if (state.screen === "live" || state.screen === "routing") { /* leg is kept so the route can be re-previewed */ }
  if (state.stack.length > 1) state.stack.pop();
  const prev = state.stack[state.stack.length - 1];
  clearTimers();
  state.screen = prev;
  render();
  $("#screen").scrollTop = 0;
  if (prev === "charging" && state.session && !state.session.stopped && !state.session.complete) startChargeTimer();
}
async function run(fn, msg) {
  if (state.busy) return;
  state.busy = true; $("#loadingText").textContent = msg || t("loading"); $("#loading").hidden = false;
  try { await simulateLatency(); await fn(); } finally { $("#loading").hidden = true; state.busy = false; }
}
let toastTimer = null;
function toast(msg) {
  const el = $("#toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
}

/* ==================== SIMULATIONS ==================== */
/* A leg runs from where the driver is to a place, on the road route when available (else a straight-line estimate). */
async function startLeg(kind, name, ll, resumed) {
  const from = state.here.ll, r = await getRoute(from, ll);
  state.leg = { kind, name, ll, from, km: r.km, coords: r.coords, estimated: r.estimated, resumed: !!resumed };
  state.routeVariant = "A"; state.navProgress = 0;
}
function turnAt(p) { return Math.min(3, Math.floor(p / 25)); }
function updateNavDom(p) {
  const el = $("#navBar"); if (!el) return;
  const idx = turnAt(p), km = legKm(), left = km * (1 - p / 100), stepKm = km * ((idx + 1) * 25 - p) / 100;
  el.style.width = p + "%";
  $("#navIcon").innerHTML = ic(cfg.navTurns[idx], 30);
  $("#navText").textContent = t("turn." + cfg.navTurns[idx]) + " " + loc(cfg.streets[idx]);
  $("#navDist").textContent = t("nav.in", { d: stepKm < 1 ? Math.max(50, Math.round(stepKm * 1000 / 50) * 50) + " m" : fmtKm(stepKm) });
  $("#navRemain").textContent = fmtKm(left) + " · " + fmtDur(legMin() * (1 - p / 100));
  if (state.navMk && state.leg.coords) state.navMk.setLatLng(pointAlong(state.leg.coords, p / 100));
}
function startNav() {
  updateNavDom(state.navProgress);
  timers.nav = setInterval(() => {
    state.navProgress = Math.min(100, state.navProgress + 100 / 60);
    updateNavDom(state.navProgress);
    if (state.navProgress >= 100) finishLeg();
  }, 200);
}
function finishLeg() {
  clearInterval(timers.nav); timers.nav = null;
  const km = legKm(), min = legMin();
  state.batteryPct = Math.max(0, state.batteryPct - km / veh.estimatedRangeKm * 100);
  state.clockMin += min;
  syncCarNow();
  setHere(state.leg.ll, "trip"); /* you are now where the leg ended */
  if (state.leg.kind === "shop") { state.stack = ["home", "maintenance"]; go("shop"); toast(t("sd.arrived", { name: loc(state.shop.name) })); return; }
  state.trip.distanceKm += km; state.trip.driveMin += min;
  if (state.leg.kind === "station") go("arrive"); else go("summary", { reset: true });
}
function taper(pct) { return pct < 60 ? 1 : Math.max(0.6, 1 - 0.4 * (pct - 60) / 20); }
function sessionKw(c) { return Math.min(c.bay.powerKw, veh.maxDcKw) * taper(c.pct); }
function startChargeTimer() {
  timers.charge = setInterval(() => {
    const c = state.session; if (!c) return;
    const kw = sessionKw(c), dk = Math.min(kw * cfg.chargeAccelSecPerTick / 3600, (c.targetPct - c.pct) / 100 * veh.capacityKwh);
    c.kw = kw; c.kwh += dk; c.pct += dk / veh.capacityKwh * 100; c.elapsedSec += cfg.chargeAccelSecPerTick;
    if (c.pct >= c.targetPct - 0.001) { c.pct = c.targetPct; c.complete = true; c.kw = 0; clearInterval(timers.charge); timers.charge = null; }
    updateChargeDom();
  }, 1000);
}
function updateChargeDom() {
  const c = state.session, el = $("#chgPct"); if (!c || !el) return;
  const r = 92, circ = 2 * Math.PI * r;
  $("#chgRing").setAttribute("stroke-dashoffset", circ * (1 - c.pct / 100));
  el.textContent = Math.round(c.pct) + "%";
  $("#chgSub").textContent = c.complete ? t("chg.done") : t("chg.title");
  $("#chgKw").textContent = round1(c.kw) + " kW";
  $("#chgKwh").textContent = round1(c.kwh) + " kWh";
  const s = Math.round(c.elapsedSec), mm = Math.floor(s / 60), ss = s % 60;
  $("#chgTime").textContent = String(mm).padStart(2, "0") + ":" + String(ss).padStart(2, "0");
  const kwNow = Math.max(1, sessionKw(c)), leftMin = (c.targetPct - c.pct) / 100 * veh.capacityKwh / kwNow * 60;
  $("#chgLeft").textContent = c.complete ? "✓" : fmtDur(leftMin);
  $("#chgCost").textContent = fmtMoney(c.kwh * c.station.tariffKhr);
}

      state.batteryPct = f.batteryPct;
      /* a driver-entered value (car doesn't share battery, or the driver changed the synced value) makes the source manual */
      if (veh.dataSource === "car" && (!veh.carSharesBattery || (f.adjust && f.batteryPct !== f.carPct))) Object.assign(veh, { dataSource: "manual", reportedRangeKm: null, updatedAt: state.clockMin });
      go("home", { reset: true });
    });
  },
  /* ---- battery check sheet ---- */
  batteryCheck() { state.batterySheet = { pct: Math.round(state.batteryPct) }; render(); },
  batteryCancel() { state.batterySheet = null; render(); },
  batterySave() {
    const pct = state.batterySheet.pct;
    state.batteryPct = pct;
    Object.assign(veh, { dataSource: "manual", reportedRangeKm: null, updatedAt: state.clockMin });
    state.batterySheet = null;
    if (state.screen === "reach" && state.destination) state.reach = reachFor(state.destination);
    render(); toast(t("bc.saved", { pct }));
  },
  batteryRefresh() {
    run(() => {
      if (!veh.carSharesBattery) { toast(t("bc.stillnone", { model: veh.model })); return; }
      Object.assign(veh, { dataSource: "car", updatedAt: state.clockMin, reportedRangeKm: round1(state.batteryPct / 100 * veh.estimatedRangeKm) });
      state.batterySheet = null;
      if (state.screen === "reach" && state.destination) state.reach = reachFor(state.destination);
      render(); toast(t("bc.refreshed"));
    }, t("cv.syncing", { brand: veh.brand }));
  },
  /* ---- charging preferences (Profile) ---- */
  prefSort(d) { state.prefs.sortBy = d.v; render(); toast(t("pref.saved")); },
  prefWarn(d) { state.prefs.warnPct = Number(d.v); render(); toast(t("pref.saved")); },
  /* ---- account ---- */
  logout() {
    run(() => {
      resetTrip();
      Object.assign(state.vehicle, MOCK_DATA.vehicle);
      Object.assign(state, {
        profile: { name: "", username: "@sokha.chan", age: 27, gender: null, custom: false },
        form: seedForm(), onb2Mode: "choice", cv: seedCv(), prefs: { ...cfg.prefDefaults }, batterySheet: null,
        optFilters: { ...cfg.optFilterDefaults }, optView: "list", optPick: null, confirmSheet: null,
        location: null, batteryPct: MOCK_DATA.vehicle.batteryPct, customDest: null
      });
      setHere(cfg.demoHome.ll, "demo"); state.startHere = state.here;
      toast(t("profile.loggedout"));
      go("onb1", { reset: true });
    });
  },
  /* ---- maintenance ---- */
  async openMaintenance() {
    await run(() => {
      state.shopsError = false;
      try {
        if (cfg.simulate.shopsError) throw new Error("shops unavailable");
        state.shops = cfg.simulate.shopsEmpty ? [] : [...MOCK_DATA.repairShops].sort((a, b) => a.distanceKm - b.distanceKm);
      } catch (e) { state.shops = []; state.shopsError = true; }
      if (state.screen === "maintenance") render(); else go("maintenance");
    });
  },
  pickShop(d) { state.shop = MOCK_DATA.repairShops.find((x) => x.id === d.id); go("shop"); },
  shopNavigate() {
    run(async () => { await startLeg("shop", state.shop.name, state.shop.ll, false); go("routing"); });
  },
  openReview() { state.rv = { stars: 0, text: "" }; go("review"); },
  rvStar(d) { state.rv.stars = Number(d.v); render(); },
  rvPost() {
    run(() => {
      state.postedReviews.unshift({ id: "rn" + (++state.seq), shopId: state.shop.id, author: userHandle(), stars: state.rv.stars, text: state.rv.text.trim(), date: cfg.today, mine: true });
      toast(t("rv.posted")); back();
    });
  },
  report(d) { state.reportFor = d.id; render(); },
  reportReason(d) {
    state.reports.push({ reportId: "rp" + (++state.seq), reviewId: state.reportFor, reporter: userHandle(), reason: d.v, at: cfg.today });
    state.reportFor = null; render(); toast(t("rp.held"));
  },
  reportCancel() { state.reportFor = null; render(); },
  /* ---- history ---- */
  openHistory() { go("history"); }
};
/* ==================== EVENTS & BOOT ==================== */
/* One delegated click handler routes every [data-act] to the actions object. */
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled || el.classList.contains("leaflet-marker-icon")) return;
  const fn = actions[el.dataset.act]; if (fn) fn(el.dataset);
});
document.addEventListener("input", (e) => {
  const el = e.target;
  if (el.id === "destInput") { state.destQuery = el.value; $("#destList").innerHTML = destListInner(); return; }
  const f = el.dataset && el.dataset.field; if (!f) return;
  const v = el.value;
  if (f === "model") {
    const m = veh.models.find((x) => x.id === v);
    state.form.model = v; state.form.capacity = String(m.capacityKwh); state.form.range = String(m.estimatedRangeKm); state.form.connector = m.connector;
    $("#f-capacity").value = state.form.capacity; $("#f-range").value = state.form.range; $("#f-connector").value = m.connector;
  } else if (f === "batteryPct") { state.form.batteryPct = Number(v); updateOnb3Dom(); }
  else if (f === "bcPct") {
    const p = Number(v); state.batterySheet.pct = p;
    $("#bcPct").textContent = p + "%"; $("#bcSave").textContent = t("bc.save", { pct: p });
    $("#bcRange").textContent = t("onb3.range", { km: fmtKmWhole(p / 100 * veh.estimatedRangeKm) });
    return;
  }
  else if (f === "rvText") { state.rv.text = v; $("#rvCount").textContent = t("rv.count", { n: v.length, max: cfg.textMaxChars }); }
  else if (f === "shopQuery") { state.shopQuery = v; $("#shopBody").innerHTML = shopBodyInner(); mountMaps(); }
  else state.form[f] = v;
  refreshForm();
});
/* distances are worked out from coordinates before the first render (constitution II.3) */
state.startHere = state.here; refreshDistances();
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && state.reportFor) actions.reportCancel(); else if (e.key === "Escape" && state.batterySheet) actions.batteryCancel(); else if (e.key === "Escape" && state.confirmSheet) actions.disconnectCancel(); });
render();
</script>
</body>
